server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Microphone is needed for the voice analyst on this origin only.
    add_header Permissions-Policy "microphone=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /index.html { add_header Cache-Control "no-cache"; add_header Permissions-Policy "microphone=(self)" always; }
    location /vendor/ { add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri $uri/ /index.html; }
}
